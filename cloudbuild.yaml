# cloudbuild.yaml — GCP Cloud Build CI/CD pipeline for xenga-facilitator
#
# Triggers on push to main. Builds the Docker image, pushes to Artifact
# Registry, and deploys to Cloud Run. Secrets are pulled from Secret Manager
# (set up once via: ./deploy.sh setup).
#
# Required substitutions (configure in Cloud Build trigger UI):
#   _GCP_REGION        Cloud Run region       (default: us-central1)
#   _CLOUD_RUN_SERVICE Cloud Run service name (default: xenga-facilitator)
#   _ARTIFACT_REPO     Artifact Registry repo (default: xenga)
#
# Optional substitutions:
#   _MIN_INSTANCES  Minimum Cloud Run instances (default: 0)
#   _MAX_INSTANCES  Maximum Cloud Run instances (default: 10)
#   _MEMORY         Cloud Run memory            (default: 512Mi)
#   _CPU            Cloud Run CPU count         (default: 1)

substitutions:
  _GCP_REGION: us-central1
  _CLOUD_RUN_SERVICE: xenga-facilitator
  _ARTIFACT_REPO: xenga
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "10"
  _MEMORY: 512Mi
  _CPU: "1"

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/PRIVATE_KEY/versions/latest
      env: PRIVATE_KEY
    - versionName: projects/$PROJECT_ID/secrets/ESCROW_VAULT_ADDRESS/versions/latest
      env: ESCROW_VAULT_ADDRESS

steps:
  # 1. Build the Docker image
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --platform
      - linux/amd64
      - --tag
      - ${_GCP_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_CLOUD_RUN_SERVICE}:$SHORT_SHA
      - --tag
      - ${_GCP_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_CLOUD_RUN_SERVICE}:latest
      - --file
      - Dockerfile
      - .

  # 2. Push both tags to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: [build]
    args:
      - push
      - --all-tags
      - ${_GCP_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_CLOUD_RUN_SERVICE}

  # 3. Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    waitFor: [push]
    secretEnv: [PRIVATE_KEY, ESCROW_VAULT_ADDRESS]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_CLOUD_RUN_SERVICE}
      - --image
      - ${_GCP_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_CLOUD_RUN_SERVICE}:$SHORT_SHA
      - --platform
      - managed
      - --region
      - ${_GCP_REGION}
      - --port
      - "8080"
      - --memory
      - ${_MEMORY}
      - --cpu
      - ${_CPU}
      - --min-instances
      - ${_MIN_INSTANCES}
      - --max-instances
      - ${_MAX_INSTANCES}
      - --allow-unauthenticated
      - --set-env-vars
      - PRIVATE_KEY=$$PRIVATE_KEY,ESCROW_VAULT_ADDRESS=$$ESCROW_VAULT_ADDRESS

images:
  - ${_GCP_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_CLOUD_RUN_SERVICE}:$SHORT_SHA
  - ${_GCP_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_CLOUD_RUN_SERVICE}:latest
