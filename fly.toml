# fly.toml app configuration file generated for xenga-facilitator on 2026-02-24T17:17:09+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xenga-facilitator'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORS_ORIGIN = 'https://www.xenga.xyz'
  DATABASE_PATH = '/data/x402-escrow.db'
  PORT = '8080'

[[mounts]]
  source = 'xenga_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
